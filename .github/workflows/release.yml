name: Release

# Publishes a tagged Omarchy WSL release: the Windows installer, a source
# tarball, and a checksums file covering them.
#
# The .wsl image is deliberately not here. It gzips to around 5 GB, which is
# well past GitHub's 2 GiB limit for a single release asset, so it is built
# from a checkout with `omarchy dev wsl build` instead. README.wsl.md is the
# procedure.
#
# Tags are calendar versions, YYYYMM.DD.N -- cut one with
#   git tag "$(date -u +%Y%m.%d.0)"
# The trailing counter distinguishes a second build on the same day. This is
# independent of the repository's `version` file, which tracks the upstream
# Omarchy package version; that file only decides whether the release is marked
# a prerelease.
#
# The VKMS kernel is built separately, by .github/workflows/wsl-kernel.yml, and
# attached to a release that already exists. It takes hours and only changes
# when the WSL2 kernel branch moves.

on:
  push:
    # Actions tag filters are globs, not regular expressions, so this only
    # approximates the format. The exact shape is checked again in the job.
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything and upload it as a workflow artifact without creating a release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Arch, not ubuntu-latest: require_command in test/shell.d/base-test.sh
    # fails rather than skips, and Ubuntu ships lua5.4 instead of lua, fdfind
    # instead of fd, ImageMagick 6 instead of magick, and no xkbcli at all.
    container: archlinux:latest
    steps:
      - name: Install the test dependencies
        # git first, so actions/checkout clones rather than falling back to a
        # tarball download without any history.
        run: |
          pacman -Sy --noconfirm --needed \
            git jq lua ripgrep fd imagemagick libxkbcommon nodejs python \
            desktop-file-utils diffutils sudo openssh

      - uses: actions/checkout@v4

      - name: Set aside the tests that need a maintainer's machine
        # Three of the 212 shell tests assert against things a clean runner
        # cannot have, so they fail here for reasons that say nothing about the
        # commit. Everything else still runs, and any other failure still fails
        # the gate.
        #
        #   unowned-system-paths, snapper, config - read PKGBUILDs from the
        #     sibling omarchy-pkgs repository, which is not published anywhere
        #     this runner can reach.
        #   hw-hybrid-gpu - runs bin/omarchy-hw-hybrid-gpu, which calls
        #     omarchy-cmd-present as a bare command. That resolves only where
        #     Omarchy is already installed. Putting the checkout's own bin/ on
        #     PATH fixes this one and breaks theme-install-guards, which
        #     deliberately runs without it.
        #   update-lock - asserts with kill -0 that omarchy-update's sleep
        #     inhibitor has stopped, immediately after waiting on the update.
        #     kill -0 succeeds against a zombie, so the assertion depends on
        #     the stub's child being reaped first, and a loaded runner widens
        #     that window. It passes reliably on a development machine.
        run: |
          mkdir -p "$RUNNER_TEMP/needs-a-maintainer-machine"
          mv test/shell.d/unowned-system-paths-test.sh \
             test/shell.d/snapper-test.sh \
             test/shell.d/config-test.sh \
             test/shell.d/hw-hybrid-gpu-test.sh \
             test/shell.d/update-lock-test.sh \
             "$RUNNER_TEMP/needs-a-maintainer-machine/"

      - name: Run the CLI and shell suites
        # As an unprivileged user, because a container job is root by default
        # and root ignores the permission bits several tests are asserting on:
        # a directory chmod'ed shut still opens, so the failure they expect
        # never happens.
        #
        # Tests that need a compositor skip themselves through
        # require_compositor, so nothing here needs a display. The graphical
        # acceptance suite is deliberately not part of ./test/all.
        run: |
          useradd --create-home tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
          runuser -u tester -- env HOME=/home/tester ./test/all

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # git archive needs the tag object, and the checkout action fetches
          # only one commit by default.
          fetch-depth: 0

      - name: Resolve and validate the release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [[ $EVENT_NAME == "push" ]]; then
            tag=$REF_NAME
            dry_run=false
            ref=$REF_NAME
          else
            # A manual run has no tag to take a version from, so synthesize
            # today's. Nothing is published either way.
            tag=$(date -u +%Y%m.%d.0)
            dry_run=$DRY_RUN_INPUT
            ref=$GITHUB_SHA
          fi

          if [[ ! $tag =~ ^[0-9]{6}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Error: '$tag' is not a YYYYMM.DD.N tag, for example 202608.31.0." >&2
            exit 1
          fi

          # The glob filter cannot tell a month from a month number, so 202613
          # and day 32 both reach here. date does know.
          year=${tag:0:4}
          month=${tag:4:2}
          day=${tag:7:2}

          if ! date -u -d "$year-$month-$day" >/dev/null 2>&1; then
            echo "Error: '$tag' does not name a real date ($year-$month-$day)." >&2
            exit 1
          fi

          # A past date is legitimate -- an old tag can be rebuilt -- so say so
          # rather than refusing.
          today=$(date -u +%Y%m.%d)
          if [[ ${tag%.*} != "$today" ]]; then
            echo "Note: $tag is not today's UTC date ($today). Building it anyway."
          fi

          # The `version` file tracks the upstream Omarchy package version on
          # its own schedule, so it does not gate the tag. It does say whether
          # what we are shipping is finished.
          version=$(< version)

          case $version in
            *alpha*|*beta*|*rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

          echo "Building $tag from Omarchy $version (prerelease: $prerelease, dry run: $dry_run)"

      - name: Build the source tarball
        env:
          TAG: ${{ steps.release.outputs.tag }}
          REF: ${{ steps.release.outputs.ref }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="omarchy-$TAG/" "$REF" -o "dist/omarchy-$TAG.tar.gz"

      - name: Stage the Windows installer
        run: cp install/wsl/windows/Install-Omarchy.ps1 dist/

      - name: Checksum every asset
        run: |
          cd dist
          : >SHA256SUMS

          for file in *; do
            if [[ $file != "SHA256SUMS" ]]; then
              sha256sum "$file" >>SHA256SUMS
            fi
          done

          cat SHA256SUMS

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"

          cat >"$notes" <<NOTES
          Omarchy $VERSION for WSL, from \`$GITHUB_SHA\`.

          ## The image is built locally

          The \`.wsl\` image is not published here. It gzips to well over GitHub's 2 GiB
          limit for a release asset, so it is built from a checkout instead:

          \`\`\`bash
          omarchy dev wsl build --output ~/omarchy.wsl
          \`\`\`

          \`README.wsl.md\` covers that end to end, including the Windows side.

          ## What is here

          - \`bzImage\` and \`bzImage-modules.tar.gz\` -- the VKMS kernel \`start-omarchy\` needs, because
            stock WSL2 kernels expose no DRM device. It takes hours to build, which is why it
            is published rather than left to you. Attached separately; if it is not here yet,
            it is still building.
          - \`Install-Omarchy.ps1\` -- installs the kernel, edits \`.wslconfig\`, imports the
            image you built and unpacks the modules.
          - the source tarball and \`SHA256SUMS\`.

          ## Install

          From PowerShell on Windows, with the image you built:

          \`\`\`powershell
          .\\Install-Omarchy.ps1 -ImagePath C:\\path\\to\\omarchy.wsl
          \`\`\`

          It fetches this release's kernel unless you pass \`-KernelPath\` or \`-SkipKernel\`.

          ## Verify

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          Note that \`kernel=\` in \`.wslconfig\` is global to every WSL distribution on the machine.
          NOTES

          echo "path=$notes" >>"$GITHUB_OUTPUT"
          cat "$notes"

      - name: Upload the artifacts
        if: steps.release.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-release-${{ steps.release.outputs.tag }}
          path: dist/
          retention-days: 7

      - name: Publish the release
        if: steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          args=(--title "$TAG" --notes-file "$NOTES")

          if [[ $PRERELEASE == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" "${args[@]}" dist/*
