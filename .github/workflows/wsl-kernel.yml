name: WSL kernel

# Builds the VKMS-enabled WSL2 kernel and attaches it to a release that already
# exists. Separate from .github/workflows/release.yml because it takes hours and
# only changes when the WSL2 kernel branch moves -- rebuilding an unchanged
# kernel on every tag would cost a great deal for an identical artifact.
#
# Stock WSL2 kernels expose Microsoft's /dev/dxg and no DRM device, so Hyprland
# has nothing to render on and `start-omarchy` cannot work. docs/wsl.md covers why.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the kernel to, for example 202608.31.0
        required: true
        type: string
      branch:
        description: WSL2-Linux-Kernel branch or tag
        default: linux-msft-wsl-6.6.y
        type: string

permissions:
  contents: write

jobs:
  kernel:
    name: Kernel
    runs-on: ubuntu-latest
    # A kernel build on the half-machine quota the build script takes is long
    # but not six hours long. Leave room rather than sitting near the ceiling.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Check that the release exists
        # Cheap, and it fails now rather than after a multi-hour build.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --json tagName --jq .tagName

      - name: Make room for the build
        run: |
          sudo systemctl stop docker.service docker.socket
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker
          printf '{ "data-root": "/mnt/docker" }\n' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker.service
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h / /mnt

      - name: Build the kernel
        env:
          BRANCH: ${{ inputs.branch }}
        # Writes dist/bzImage and, alongside it, dist/bzImage-modules.tar.gz.
        # The modules matter: the stock WSL kernel leaves most of itself as
        # modules and ships them in the distribution image, so a bzImage on its
        # own silently drops every =m option and dockerd stops starting.
        run: |
          mkdir -p dist
          ./bin/omarchy-dev-wsl-kernel --output dist/bzImage --branch "$BRANCH"
          ls -lh dist

      - name: Merge the kernel into the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # One SHA256SUMS covers the whole release, so take the file the image
        # workflow published, drop any previous kernel lines, and add ours.
        run: |
          sums="$RUNNER_TEMP/SHA256SUMS"

          if gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"; then
            echo "Merging into the existing SHA256SUMS."
          else
            echo "No SHA256SUMS on $TAG yet; starting one."
            : >"$sums"
          fi

          grep -v -E '  (bzImage|bzImage-modules\.tar\.gz)$' "$sums" >"$sums.new" || true
          (cd dist && sha256sum bzImage bzImage-modules.tar.gz) >>"$sums.new"
          mv "$sums.new" "$sums"
          cat "$sums"

      - name: Attach the kernel to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/bzImage \
            dist/bzImage-modules.tar.gz \
            "$RUNNER_TEMP/SHA256SUMS" \
            --clobber
