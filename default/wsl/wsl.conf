# /etc/wsl.conf — read by WSL every time the distribution boots.

[boot]
# Omarchy is a systemd distribution: uwsm, the user units the shell relies on,
# and every masked unit in install/wsl/services.sh assume PID 1 is systemd.
systemd=true

[interop]
enabled=true
appendWindowsPath=true

[network]
# WSL writes /etc/resolv.conf from the Windows resolver. install/wsl/services.sh
# masks systemd-resolved so the two cannot fight over the file.
generateResolvConf=true

# No [user] default here on purpose. /etc/oobe.sh creates the account on first
# run and [oobe] defaultUid in wsl-distribution.conf points WSL at it, so a
# name pinned here would only be wrong for anyone who picks a different one.
