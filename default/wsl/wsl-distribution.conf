# /etc/wsl-distribution.conf — read by WSL when the image is first imported.

[oobe]
# Runs once, as root, before the first shell. Must exit 0 or WSL refuses to
# open a shell at all.
command = /etc/oobe.sh
# The account /etc/oobe.sh creates. WSL logs in as this uid from then on.
defaultUid = 1000
# Required for `wsl --install --from-file` and for double-clicking the .wsl
# file to work; without it WSL has no name to register the distribution under.
defaultName = Omarchy

[shortcut]
enabled = true
icon = /usr/lib/wsl/omarchy.ico

[windowsterminal]
enabled = true
ProfileTemplate = /usr/lib/wsl/terminal-profile.json
